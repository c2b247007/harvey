<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sellbird</title>
<!--
  One small page for every Sellbird card in an agent's chat (the MCP Apps
  standard). The host sends the tool's result; the card shows it and links
  to the dashboard. A card never approves, sends or changes anything: its
  only button opens the item in the dashboard, where the person decides.
  Everything shown is set as text, never as HTML.
-->
<style>
/*FONT*/
:root {
  color-scheme: light;
  --surface: #FFFFFF; --subtle: #F7F8F9; --chip: #EEF1F3; --line: #E9ECEF; --line2: #DCE1E5;
  --fg: #16202A; --fg2: #5A6672; --fg3: #6C7883;
  --accent: #244B62; --on: #FFFFFF; --soft: #E9F0F4;
  --good: #1B7348; --good-bg: #E9F6EF; --wait: #875800; --wait-bg: #FEF5E2; --bad: #AE222E; --bad-bg: #FDEEEF;
  --sans: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface: #16191C; --subtle: #1B1F23; --chip: #272C31; --line: #262B30; --line2: #32383E;
  --fg: #ECEFF1; --fg2: #A0ABB4; --fg3: #8B97A1;
  --accent: #A3C9DE; --on: #0D2230; --soft: #1C2E39;
  --good: #5CCB8F; --good-bg: #10261B; --wait: #F0B84F; --wait-bg: #2A2010; --bad: #FF7A85; --bad-bg: #2C1316;
}
* { box-sizing: border-box; margin: 0; }
html, body { background: transparent; }
body { font: 400 14px/1.45 var(--sans); color: var(--fg); -webkit-font-smoothing: antialiased; }
.card { background: var(--surface); border-radius: 16px; box-shadow: 0 0 0 1px var(--line2); padding: 16px 16px 12px; max-width: 640px; }
.head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 4px; }
.brand { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--fg3); }
h1 { font-size: 17px; font-weight: 620; letter-spacing: -0.01em; line-height: 1.3; }
.sub { color: var(--fg2); font-size: 13.5px; margin-top: 2px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 8px; margin: 14px 0 6px; }
.stat { border-radius: 12px; background: var(--subtle); padding: 10px 12px; min-width: 0; }
.stat b { display: block; font-size: 22px; font-weight: 620; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; line-height: 1.15; }
.stat span { color: var(--fg2); font-size: 12.5px; }
.rows { margin-top: 10px; }
.row { display: flex; align-items: center; gap: 12px; padding: 11px 2px; border-top: 1px solid var(--line); min-width: 0; }
.row:first-child { border-top-color: transparent; }
.grow { flex: 1; min-width: 0; }
.t { font-weight: 580; overflow-wrap: anywhere; }
.s { color: var(--fg2); font-size: 13px; overflow-wrap: anywhere; }
.tag { display: inline-block; margin-top: 4px; padding: 1px 8px; border-radius: 99px; font-size: 11.5px; font-weight: 580; }
.tag.wait { background: var(--wait-bg); color: var(--wait); }
.tag.bad { background: var(--bad-bg); color: var(--bad); }
.tag.good { background: var(--good-bg); color: var(--good); }
.tag.acc { background: var(--soft); color: var(--accent); }
button { flex: none; min-height: 34px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line2);
         background: var(--surface); color: var(--fg); font: 580 13px/1 var(--sans); cursor: pointer; }
button.pri { background: var(--accent); border-color: var(--accent); color: var(--on); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button:disabled { opacity: .6; cursor: default; }
.foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
        margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
.note { color: var(--fg3); font-size: 12px; }
.empty { color: var(--fg2); padding: 10px 2px; }
@media (max-width: 380px) { .row { flex-wrap: wrap; } .row button { margin-left: auto; } }
</style>
</head>
<body>
<div class="card" id="card" aria-live="polite"><p class="empty">Loading Sellbird...</p></div>
<script>
(function () {
  'use strict';
  var nextId = 0, pending = {};
  var card = document.getElementById('card');

  function send(msg) { window.parent.postMessage(msg, '*'); }
  function rpc(method, params) {
    var id = ++nextId;
    send({jsonrpc: '2.0', id: id, method: method, params: params || {}});
    return new Promise(function (resolve) {
      pending[id] = resolve;
      setTimeout(function () { if (pending[id]) { delete pending[id]; resolve(null); } }, 8000);
    });
  }
  function notify(method, params) { send({jsonrpc: '2.0', method: method, params: params || {}}); }

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined && text !== null) e.textContent = String(text);
    return e;
  }
  function theme(ctx) {
    var t = ctx && ctx.theme;
    if (!t && window.matchMedia) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
  }
  function resized() {
    notify('ui/notifications/size-changed',
           {width: document.documentElement.scrollWidth, height: document.documentElement.scrollHeight});
  }

  // Opening something in the dashboard: ask Sellbird for a one-use sign-in
  // link to that page, then ask the host to open it.
  function open(page, button) {
    if (button) button.disabled = true;
    rpc('tools/call', {name: 'dashboard_open', arguments: {page: page || ''}}).then(function (res) {
      var url = res && res.structuredContent && res.structuredContent.url;
      if (!url && res && res.content && res.content[0] && res.content[0].text) {
        var m = /https?:\/\/127\.0\.0\.1:\d+\/#\S+|https?:\/\/localhost:\d+\/#\S+/.exec(res.content[0].text);
        url = m && m[0];
      }
      if (url && /^http:\/\/(127\.0\.0\.1|localhost):\d+\/#/.test(url)) return rpc('ui/open-link', {url: url});
      if (button) button.textContent = 'Ask your agent to open it';
    }).then(function () { if (button) button.disabled = false; });
  }

  function stats(list) {
    var box = el('div', 'stats');
    list.forEach(function (s) {
      var d = el('div', 'stat');
      d.appendChild(el('b', '', s[0]));
      d.appendChild(el('span', '', s[1]));
      box.appendChild(d);
    });
    return box;
  }
  function row(item) {
    var r = el('div', 'row'), g = el('div', 'grow');
    g.appendChild(el('p', 't', item.title));
    if (item.detail) g.appendChild(el('p', 's', item.detail));
    if (item.tag) g.appendChild(el('span', 'tag ' + (item.tone || ''), item.tag));
    r.appendChild(g);
    if (item.page) {
      var b = el('button', item.primary ? 'pri' : '', item.action || 'Review');
      b.type = 'button';
      b.addEventListener('click', function () { open(item.page, b); });
      r.appendChild(b);
    }
    return r;
  }

  function render(data) {
    if (!data || typeof data !== 'object') return;
    card.textContent = '';
    var head = el('div', 'head');
    head.appendChild(el('span', 'brand', 'Sellbird'));
    if (data.when) head.appendChild(el('span', 'note', data.when));
    card.appendChild(head);
    card.appendChild(el('h1', '', data.title || 'Sellbird'));
    if (data.subtitle) card.appendChild(el('p', 'sub', data.subtitle));
    if (data.stats && data.stats.length) card.appendChild(stats(data.stats));
    var rows = el('div', 'rows');
    (data.items || []).forEach(function (it) { rows.appendChild(row(it)); });
    if (!(data.items || []).length && data.empty) rows.appendChild(el('p', 'empty', data.empty));
    card.appendChild(rows);
    var foot = el('div', 'foot');
    foot.appendChild(el('span', 'note', data.note || 'Nothing sends until you approve it in the dashboard.'));
    var all = el('button', '', data.open_label || 'Open the dashboard');
    all.type = 'button';
    all.addEventListener('click', function () { open(data.page || '', all); });
    foot.appendChild(all);
    card.appendChild(foot);
    resized();
  }

  window.addEventListener('message', function (e) {
    if (e.source !== window.parent) return;
    var m = e.data;
    if (!m || m.jsonrpc !== '2.0') return;
    if (m.id !== undefined && pending[m.id]) { var f = pending[m.id]; delete pending[m.id]; f(m.result || null); return; }
    if (m.method === 'ui/notifications/tool-result') render((m.params || {}).structuredContent);
    else if (m.method === 'ui/notifications/host-context-changed') theme(m.params);
  });

  theme(null);
  rpc('ui/initialize', {
    protocolVersion: '2026-01-26',
    appInfo: {name: 'sellbird-card', version: '1'}, clientInfo: {name: 'sellbird-card', version: '1'},
    appCapabilities: {}, capabilities: {},
  }).then(function (res) {
    theme(res && res.hostContext);
    notify('ui/notifications/initialized');
  });
  // A host that renders the page without the protocol (or a preview) can
  // hand data in directly.
  window.sellbirdRender = render;
  if (window.ResizeObserver) new ResizeObserver(resized).observe(document.body);
})();
</script>
</body>
</html>
