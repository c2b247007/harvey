# Contributor License Agreement check. Every outside contributor signs CLA.md once,
# by commenting on their pull request. Signatures are stored as JSON on the
# `cla-signatures` branch, never on main. This workflow does not check out or run
# any code from the pull request.
name: cla

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize, reopened]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'pull_request_target') ||
      (github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
         github.event.comment.body == 'I have read the Sellbird CLA and I agree to it.'))
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/ethanplusai/sellbird/blob/main/CLA.md
          path-to-signatures: signatures/cla-v1.json
          branch: cla-signatures
          allowlist: ethanplusai,dependabot[bot],github-actions[bot]
          custom-pr-sign-comment: I have read the Sellbird CLA and I agree to it.
          custom-notsigned-prcomment: >-
            Thanks for your pull request. Before it can be merged, please read the
            [Sellbird Contributor License Agreement](https://github.com/ethanplusai/sellbird/blob/main/CLA.md)
            and, if you agree, post the comment below. You only need to do this once.
          custom-allsigned-prcomment: Everyone on this pull request has signed the Sellbird CLA. Thank you.
          lock-pullrequest-aftermerge: false
